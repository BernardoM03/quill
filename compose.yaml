# Quill in Docker.
#   Local only:              docker compose up -d --build
#   Public, via Cloudflare:  docker compose --profile tunnel up -d --build
# Settings come from .env next to this file; copy .env.example to start.

name: quill

services:
  quill:
    build: .
    image: quill:latest
    restart: unless-stopped
    environment:
      QUILL_PUBLIC_URL: ${QUILL_PUBLIC_URL:-http://localhost:8000}
      QUILL_SECURE_COOKIES: ${QUILL_SECURE_COOKIES:-0}
      QUILL_CLIENT_IP_HEADER: ${QUILL_CLIENT_IP_HEADER:-}
      QUILL_SECRET_KEY: ${QUILL_SECRET_KEY:-}
      # Log the real visitor IP when behind Cloudflare (blank otherwise).
      GUNICORN_CMD_ARGS: >-
        --access-logformat '%({cf-connecting-ip}i)s %(h)s "%(r)s" %(s)s %(b)s %(M)sms "%(a)s"'
    volumes:
      - quill-data:/app/data
    ports:
      # Loopback only: reachable from this machine for admin and debugging, never from the LAN.
      # The tunnel reaches the app over the internal network, so nothing public is exposed.
      - "127.0.0.1:${QUILL_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      quill:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  quill-data:
